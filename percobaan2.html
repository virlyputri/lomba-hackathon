<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AegisAI</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#0B1220] text-white">
    <!-- CONTAINER -->
    <div class="min-h-screen flex flex-col">
      <!-- HEADER -->
      <header
        class="flex items-center justify-between px-8 py-5 border-b border-gray-700"
      >
        <!-- LOGO -->
        <h1 class="text-2xl font-bold">AegisAI</h1>

        <!-- MENU -->
        <nav class="flex gap-4">
          <button
            onclick="showPage('input')"
            class="px-4 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 transition"
          >
            Input Data
          </button>

          <button
            onclick="showPage('history')"
            class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-blue-600 transition"
          >
            History
          </button>
        </nav>
      </header>

      <!-- MAIN -->
      <main class="flex-1 p-8 overflow-auto">
        <!-- ================================================= -->
        <!-- INPUT PAGE -->
        <!-- ================================================= -->
        <div id="inputPage" class="max-w-4xl mx-auto space-y-6">
          <!-- TRUCK INFORMATION -->
          <div class="bg-white rounded-xl p-6">
            <h2 class="text-black text-xl font-semibold mb-5">
              🚚 Truck Information
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="text-black font-medium"> Truck ID </label>

                <input
                  id="truckId"
                  type="text"
                  placeholder="TRK-001"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>

              <div>
                <label class="text-black font-medium"> Odometer (km) </label>

                <input
                  id="odometer"
                  type="number"
                  placeholder="120000"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>
            </div>
          </div>

          <!-- MAINTENANCE DETAILS -->
          <div class="bg-white rounded-xl p-6">
            <h2 class="text-black text-xl font-semibold mb-5">
              🔧 Maintenance Details
            </h2>

            <div class="space-y-5">
              <div>
                <label class="text-black font-medium"> Maintenance Date </label>

                <input
                  id="maintenanceDate"
                  type="date"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>

              <div>
                <label class="text-black font-medium"> Maintenance Type </label>

                <input
                  id="maintenanceType"
                  type="text"
                  placeholder="Engine Repair"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>

              <div>
                <label class="text-black font-medium">
                  Service Description
                </label>

                <textarea
                  id="serviceDescription"
                  rows="4"
                  placeholder="Describe maintenance activity..."
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                ></textarea>
              </div>
            </div>
          </div>

          <!-- USAGE METRICS -->
          <div class="bg-white rounded-xl p-6">
            <h2 class="text-black text-xl font-semibold mb-5">
              📊 Usage Metrics
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="text-black font-medium">
                  Maintenance Working Hours
                </label>

                <input
                  id="workingHours"
                  type="number"
                  placeholder="8"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>

              <div>
                <label class="text-black font-medium">
                  Maintenance Downtime (hours)
                </label>

                <input
                  id="downtime"
                  type="number"
                  placeholder="2"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>
            </div>
          </div>

          <!-- COST INFORMATION -->
          <div class="bg-white rounded-xl p-6">
            <h2 class="text-black text-xl font-semibold mb-5">
              💰 Cost Information
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="text-black font-medium"> Maintenance Cost </label>

                <input
                  id="maintenanceCost"
                  type="number"
                  placeholder="500000"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>

              <div>
                <label class="text-black font-medium"> Spare Parts Cost </label>

                <input
                  id="sparePartsCost"
                  type="number"
                  placeholder="250000"
                  class="w-full mt-2 p-3 rounded-lg bg-gray-200 text-black focus:outline-none"
                />
              </div>
            </div>
          </div>

          <!-- SUBMIT BUTTON -->
          <button
            onclick="submitData()"
            class="w-full bg-blue-500 hover:bg-blue-600 transition p-4 rounded-xl font-semibold"
          >
            Submit Data
          </button>
        </div>

        <!-- ================================================= -->
        <!-- HISTORY PAGE -->
        <!-- ================================================= -->
        <div id="historyPage" class="hidden">
          <!-- TOP -->
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">📜 Maintenance History</h2>

            <button
              onclick="clearHistory()"
              class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg transition"
            >
              Clear History
            </button>
          </div>

          <!-- TABLE -->
          <div class="bg-white rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-black text-sm">
                <thead class="bg-gray-200">
                  <tr>
                    <th class="p-4 text-left">Input Date</th>
                    <th class="p-4 text-left">Truck ID</th>
                    <th class="p-4 text-left">Odometer</th>
                    <th class="p-4 text-left">Maintenance Date</th>
                    <th class="p-4 text-left">Type</th>
                    <th class="p-4 text-left">Description</th>
                    <th class="p-4 text-left">Working Hours</th>
                    <th class="p-4 text-left">Downtime</th>
                    <th class="p-4 text-left">Maintenance Cost</th>
                    <th class="p-4 text-left">Spare Parts Cost</th>
                    <th class="p-4 text-left">Action</th>
                  </tr>
                </thead>

                <tbody id="historyTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->
    <script>
      // SHOW PAGE
      function showPage(page) {
        document.getElementById("inputPage").classList.add("hidden");

        document.getElementById("historyPage").classList.add("hidden");

        if (page === "input") {
          document.getElementById("inputPage").classList.remove("hidden");
        }

        if (page === "history") {
          document.getElementById("historyPage").classList.remove("hidden");

          loadHistory();
        }
      }

      // SUBMIT DATA
      function submitData() {
        const data = {
          inputDate: new Date().toLocaleString(),

          truckId: document.getElementById("truckId").value,

          odometer: document.getElementById("odometer").value,

          maintenanceDate: document.getElementById("maintenanceDate").value,

          maintenanceType: document.getElementById("maintenanceType").value,

          serviceDescription:
            document.getElementById("serviceDescription").value,

          workingHours: document.getElementById("workingHours").value,

          downtime: document.getElementById("downtime").value,

          maintenanceCost: document.getElementById("maintenanceCost").value,

          sparePartsCost: document.getElementById("sparePartsCost").value,
        };

        // VALIDASI
        if (
          data.truckId === "" ||
          data.maintenanceDate === "" ||
          data.maintenanceType === ""
        ) {
          alert("Please fill all required fields.");
          return;
        }

        // AMBIL DATA LAMA
        let history =
          JSON.parse(localStorage.getItem("maintenanceHistory")) || [];

        // TAMBAH DATA BARU
        history.push(data);

        // SIMPAN
        localStorage.setItem("maintenanceHistory", JSON.stringify(history));

        // ALERT
        alert("Data successfully saved!");

        // RESET FORM
        document.querySelectorAll("input, textarea").forEach((field) => {
          field.value = "";
        });
      }

      // LOAD HISTORY
      function loadHistory() {
        const table = document.getElementById("historyTable");

        table.innerHTML = "";

        let history =
          JSON.parse(localStorage.getItem("maintenanceHistory")) || [];

        if (history.length === 0) {
          table.innerHTML = `
          <tr>
            <td colspan="11" class="p-6 text-center text-gray-500">
              No maintenance history available.
            </td>
          </tr>
        `;

          return;
        }

        history.forEach((item, index) => {
          table.innerHTML += `

          <tr class="border-b border-gray-300 hover:bg-gray-100 transition">

            <td class="p-4">${item.inputDate}</td>

            <td class="p-4">${item.truckId}</td>

            <td class="p-4">${item.odometer}</td>

            <td class="p-4">${item.maintenanceDate}</td>

            <td class="p-4">${item.maintenanceType}</td>

            <td class="p-4">${item.serviceDescription}</td>

            <td class="p-4">${item.workingHours}</td>

            <td class="p-4">${item.downtime}</td>

            <td class="p-4">Rp ${item.maintenanceCost}</td>

            <td class="p-4">Rp ${item.sparePartsCost}</td>

            <td class="p-4">

              <button
                onclick="deleteHistory(${index})"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg transition"
              >
                Delete
              </button>

            </td>

          </tr>
        `;
        });
      }

      // DELETE HISTORY
      function deleteHistory(index) {
        let history =
          JSON.parse(localStorage.getItem("maintenanceHistory")) || [];

        history.splice(index, 1);

        localStorage.setItem("maintenanceHistory", JSON.stringify(history));

        loadHistory();
      }

      // CLEAR HISTORY
      function clearHistory() {
        const confirmDelete = confirm("Delete all history data?");

        if (confirmDelete) {
          localStorage.removeItem("maintenanceHistory");

          loadHistory();
        }
      }
    </script>
  </body>
</html>
